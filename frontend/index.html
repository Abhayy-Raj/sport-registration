<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Competition Registation </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
    <h1 class="title">Welcome to Sport Registration</h1>
</div>

<div class="box">
    <form class="main-registration">

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text">
        </div>

        <div class="form-group">
            <label for="reg-id">Registration ID</label>
            <input id="reg-id" type="text">
        </div>

        <div class="form-group">
            <label for="phone">Phone No.</label>
            <input id="phone" type="number">
        </div>

        <div class="form-group">
            <label for="section">Section</label>
            <input id="section" type="text">
        </div>

        <div class="form-group">
            <label for="year">Year</label>
            <input id="year" type="number">
        </div>

        <button type="submit">Register</button>

    </form>
</div>
<script src="app.js"></script>
    
</body>
</html>
